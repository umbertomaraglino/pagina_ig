<!DOCTYPE html>
<html>
<head><meta charset="utf-8"><title>Music API Test</title>
<style>body{font-family:monospace;padding:20px;background:#111;color:#eee}
.ok{color:#4ade80}.err{color:#f87171}.info{color:#60a5fa}
pre{background:#222;padding:10px;border-radius:6px;white-space:pre-wrap;word-break:break-all;font-size:12px}
button{margin:6px 4px;padding:8px 14px;background:#333;color:#fff;border:none;border-radius:6px;cursor:pointer;font-size:13px}
button:hover{background:#444}</style>
</head>
<body>
<h2>🎵 Music API Diagnostic</h2>
<div id="log"></div>

<button onclick="testDeezerDirect()">1. Deezer direct</button>
<button onclick="testDeezerProxy()">2. Deezer via corsproxy.io</button>
<button onclick="testDeezerProxy2()">3. Deezer via codetabs</button>
<button onclick="testItunesDirect()">4. iTunes direct</button>
<button onclick="testItunesProxy()">5. iTunes via corsproxy.io</button>
<button onclick="runAll()">▶ Run ALL</button>

<script>
const log = document.getElementById('log')

function write(html) {
  const div = document.createElement('div')
  div.innerHTML = html
  log.appendChild(div)
}

async function testUrl(label, url) {
  write(`<span class="info">▶ Testing: ${label}</span>`)
  write(`<pre>${url}</pre>`)
  const t0 = Date.now()
  try {
    const res = await fetch(url, { signal: AbortSignal.timeout(8000) })
    const ms = Date.now() - t0
    write(`<span class="ok">✓ HTTP ${res.status} — ${ms}ms</span>`)
    const text = await res.text()
    let parsed
    try { parsed = JSON.parse(text) } catch { }
    if (parsed) {
      const items = parsed.data ?? parsed.results ?? []
      write(`<span class="ok">✓ JSON parsed — ${items.length} items</span>`)
      if (items.length > 0) {
        const first = items[0]
        const preview = first.preview ?? first.previewUrl ?? '(none)'
        write(`<pre>First item: ${JSON.stringify({ title: first.title ?? first.trackName, artist: first.artist?.name ?? first.artistName, preview }, null, 2)}</pre>`)
      }
    } else {
      write(`<span class="err">✗ Not valid JSON</span><pre>${text.slice(0, 200)}</pre>`)
    }
  } catch (e) {
    const ms = Date.now() - t0
    write(`<span class="err">✗ ${e.message} (${ms}ms)</span>`)
  }
  write('<hr style="border-color:#333;margin:12px 0">')
}

const DEEZER = 'https://api.deezer.com/search?q=top+hits&limit=5'
const ITUNES = 'https://itunes.apple.com/search?term=top+hits&media=music&limit=5&country=us'

function testDeezerDirect()       { testUrl('Deezer direct', DEEZER) }
function testDeezerProxy()        { testUrl('Deezer via corsproxy.io', `https://corsproxy.io/?url=${encodeURIComponent(DEEZER)}`) }
function testDeezerProxy2()       { testUrl('Deezer via codetabs.com', `https://api.codetabs.com/v1/proxy?quest=${encodeURIComponent(DEEZER)}`) }
function testItunesDirect()       { testUrl('iTunes direct', ITUNES) }
function testItunesProxy()        { testUrl('iTunes via corsproxy.io', `https://corsproxy.io/?url=${encodeURIComponent(ITUNES)}`) }

async function runAll() {
  log.innerHTML = ''
  await testDeezerDirect()
  await testDeezerProxy()
  await testDeezerProxy2()
  await testItunesDirect()
  await testItunesProxy()
}
</script>
</body>
</html>
